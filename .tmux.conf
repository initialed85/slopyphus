# enable mouse scrolling
set -g mouse on

# Copy must reach the browser clipboard.
#
# tmux 3.6 emits the OSC 52 clipboard sequence by default (set-clipboard external), and its default
# binding for a released mouse selection lives in the *copy-mode* table because mode-keys defaults to
# emacs. The unbind below targeted copy-mode-vi, which this configuration never activates, so it did
# nothing except hide the intent: a drag highlighted text, tmux dutifully copied it, and the old ttyd
# client threw OSC 52 away because xterm.js registers no handler for it.
# Verified locally: with `set-clipboard off` the sequence disappears, and a
# `terminal-overrides ",*:Ms=\E]52;..."` (\E is not expanded by tmux) suppresses it entirely.
set -g set-clipboard on
bind-key -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel

# ctrl + shift + g for broadcast
bind-key -n C-S-g setw synchronize-panes

# alt + shift + enter to maximize/restore the selected pane
bind-key -n M-S-Enter resize-pane -Z

# broadcast indicator
setw -g window-status-current-format '#{?pane_synchronized,#[bg=red],}#I:#W'

# not sure, pi was suggesting it
set -g extended-keys on
set -g extended-keys-format csi-u

# Customize characters that count as word separators (removing / or others if desired)
set -g word-separators " |{}()[]<>`='\"!@#$%^&*:;,?"

# more hail mary shift + enter
set -as terminal-features ',xterm-256color:extkeys'

# clipboard maybe
# allow-passthrough also lets an app's own OSC 52 out of the pane, which is how Pi's copy keybinding
# reaches the browser (PI_CLIPBOARD_OSC52=1 in docker-entrypoint.sh).
set -g allow-passthrough on

# A window has one size, and `window-size latest` (tmux 3.6's default, and what this file used to leave
# implicit) makes that size follow the most recently active client. Measured in a scratch server with a 248x65
# client attached first and a 9x50 one second:
#
#   window-size latest   -> window 9x49    smallest -> 9x49
#   window-size largest  -> window 248x64  manual   -> 248x65
#
# `aggressive-resize off` does not prevent it. In practice the small client is the front desktop's grid cell -
# a 20-column desktop makes every agent pane roughly 60px wide - so one thumbnail silently reflowed the agent
# for everyone else, including a full-tab laptop, and reflowed Pi's own text and its inline images with it: in
# a 9-column pane Pi sizes an image to 7 cells, which is a 49px sliver and reads as "the image did not render".
#
# `largest` keeps the window at the widest viewer and lets the small ones show a cropped slice of it, which is
# the trade the front's owner chose: a thumbnail that shows part of a real pane is more useful than a whole
# pane nobody can read, and it stops a thumbnail from degrading every other viewer of that agent.
set -g window-size largest

# unicode?
# set -g default-terminal "tmux-256color"
# set -ga terminal-overrides ",*:UTF-8"

# dynamically resize the window to the size of the active looking client
setw -g aggressive-resize on

# prevent tmux from capping the size based on historical or detached clients
set -g window-size latest

set-option -g history-limit 65536
