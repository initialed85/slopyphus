# Build check for both images this repo ships, plus a render check for the front's config generator.
#
# This repository has no test suite: it is a Dockerfile that assembles a terminal environment (ubuntu,
# tmux, ttyd, trzsz, docker-cli, uv) plus a nginx front, and "does the image still build" is a real
# gate, because every layer here is an apt/PPA/curl install against a moving upstream: `ubuntu:26.04`,
# the trzsz PPA and the docker.com repo can each break the build without a single line of this repo
# changing.
#
# Building the front image only proves the layers copy, though. The front's nginx.conf and index.html are
# generated at container start by docker-entrypoint.nginx.sh from COLUMNS / ROWS / LAYOUT, so the part
# that can silently rot is the generator, not the image: a rendered config that nginx refuses to start
# with, or a pane whose rewrite sends ttyd to the wrong base path, is invisible to `docker build`. The
# second step runs the generator against a real nginx and asserts what it emitted.
#
# That step uses the public `nginx:alpine` image and the templates straight from the checkout, not the
# image built by the previous step: Woodpecker pulls a step image from a registry, and
# `initialed85/slopyphus-nginx:$CI_COMMIT_SHA` exists only in the CI node's daemon (nothing here pushes
# it), so it is not something a later step can run.
#
# Deliberately does NOT push: this file is the gate, `.woodpecker/build.yaml` is the publish, and on a
# push to master the gate runs first and the publish runs the same builds again against the same pinned
# node (so the second run is mostly `CACHED`). A publish should not be able to ship something the gate
# would have refused, and the gate should not be the thing that decides what is in the registry.
#
# The build runs against one CI node's dockerd over TCP (`docker-beefcake-ci-1` Service ->
# 192.168.1.213:2375, published by home-ops
# clusters/dev/applications/woodpecker/files/enable-docker-tcp.sh). Pinning one node per repo is what
# keeps the layer cache warm, which matters a lot here: this Dockerfile is apt-heavy.
#
# The GitHub repo used to be `slophyphus` (a stray h) while the image tag was always
# `initialed85/slopyphus` (no h). The repo is now `slopyphus`, so the names match; the image names never
# changed, because they are what the cluster's kustomizations and any hand-pull already reference.
steps:
  - name: build-app-image
    image: docker.io/library/docker:cli
    privileged: true
    environment:
      DOCKER_HOST: tcp://docker-beefcake-ci-1:2375
    commands:
      - docker info --format 'daemon={{.Name}} images_before={{.Images}}'
      - docker build --pull --progress=plain -t initialed85/slopyphus:$CI_COMMIT_SHA -f ./Dockerfile .
      - docker build --pull --progress=plain -t initialed85/slopyphus-nginx:$CI_COMMIT_SHA -f ./Dockerfile.nginx .
      # The agent's ttyd is compiled from vendor/ttyd, so the build only means something if the checkout
      # actually carries the vendored sources. plugin-git clones submodules recursively by default
      # (`recursive: true`, `submodule-partial: true` at depth 1), which checks out the pinned commit
      # rather than a branch tip - so these two tests are really asserting that the pins are real.
      - "test -s vendor/ttyd/src/html.h || (echo 'FAIL: vendor/ttyd is not populated (git submodule update --init --recursive)'; exit 1)"
      - "test -s vendor/xterm.js/package.json || (echo 'FAIL: vendor/xterm.js is not populated'; exit 1)"
      # `ttyd --version` is the only evidence inside a running container of which ttyd is serving a pane,
      # and the -slopyphus suffix comes from a hunk in the fork's CMakeLists.txt that a rebase onto
      # upstream can silently drop. The builder stage greps for it too; this is the same check against
      # the shipped image instead of the intermediate one.
      - "docker run --rm --entrypoint ttyd initialed85/slopyphus:$CI_COMMIT_SHA --version | grep slopyphus"
      # The fork links against shared libraries apt would otherwise have pulled in for ttyd's package;
      # an unresolved `ldd` line is an image that starts and then fails the first time a pane asks for
      # ttyd, which is the worst possible time to find out.
      - "if docker run --rm --entrypoint ldd initialed85/slopyphus:$CI_COMMIT_SHA /usr/bin/ttyd | grep 'not found'; then echo 'FAIL: the forked ttyd has unresolved libraries in the agent image'; exit 1; fi"
      - "echo 'agent ttyd links resolve'"
      # And the failure `ldd` cannot see: libwebsockets dlopens its libuv event loop plugin, so a missing
      # libwebsockets-evlib-uv leaves a binary with a perfectly clean `ldd` that still refuses to start
      # (`lws_create_context: failed to load evlib_uv`). This check was written after that exact mistake,
      # not before it.
      - "if docker run --rm --entrypoint timeout initialed85/slopyphus:$CI_COMMIT_SHA 5 ttyd -p 7699 true 2>&1 | grep -q 'failed to load evlib'; then echo 'FAIL: libwebsockets cannot load its libuv plugin in the agent image'; exit 1; fi"
      - "echo 'agent ttyd starts (event loop plugin loads)'"
      # The document ttyd serves *is* the client bundle: it is compiled into the binary, and until recently it
      # was served with content-type and content-length and nothing else - no ETag, no Last-Modified, no
      # conditional path, because an embedded resource has no file to date. A tab opened across a rollout then
      # keeps running whatever bundle it cached, which from inside the pane is indistinguishable from a fix
      # that never deployed. Asserted against the shipped image rather than by grepping the fork, because the
      # header is the thing a libwebsockets upgrade could plausibly lose.
      - |
        if docker run --rm --entrypoint sh initialed85/slopyphus:$CI_COMMIT_SHA -c 'ttyd -p 7698 -b /gate true >/tmp/ttyd.log 2>&1 & sleep 2; curl -sS -D - -o /dev/null http://127.0.0.1:7698/gate/ | tr -d "\r" | grep -qi "^cache-control: no-store"'; then
          echo 'pane document is served no-store'
        else
          echo 'FAIL: ttyd serves the pane document without Cache-Control: no-store, so a browser can keep a pre-rollout bundle'
          exit 1
        fi
      - docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep slopyphus || true
      - docker system df

  - name: check-vendored-client
    image: docker.io/library/node:22-slim
    commands:
      # ttyd embeds its whole browser UI as a generated header (`vendor/ttyd/src/html.h`, gzipped bytes as
      # a C array), and the agent image compiles that header rather than the TypeScript under
      # vendor/ttyd/html/src. So a client edit that is not rebuilt lands in the fork's source tree, passes
      # review, and changes nothing a user can see. This is the gate for that mistake: every marker has to
      # be in the source *and* in the shipped header, which is only true if build-ttyd-client.sh ran.
      - "test -s vendor/ttyd/src/html.h || (echo 'FAIL: vendor/ttyd/src/html.h is empty'; exit 1)"
      - "node hack/html-h-payload.mjs vendor/ttyd/src/html.h > /tmp/client-bundle.js"
      - "test -s /tmp/client-bundle.js"
      # String literals survive minification, call sites do not, so the markers are messages the client
      # logs rather than identifiers - and a marker has to be a single literal, not a phrase a template
      # expression assembles at runtime, which is why this one stops at the arrow rather than quoting the
      # whole log line. 'mobile font size' and 'mobile touch scroll enabled' are the two phone rules - a
      # pane picks its own font size, and a vertical swipe becomes the pane's wheel - and both are decisions
      # a front page cannot make for a pane it only frames. 'fallback clipboard copy failed' is the OSC 52
      # clipboard path and 'Shift+Enter -> newline enabled' is the keystroke mapping; both are things a
      # front page cannot provide for a pane it only frames, which is the reason ttyd is forked at all.
      - |
        for marker in 'fallback clipboard copy failed' 'malformed OSC 52 payload' 'Shift+Enter -> newline' 'mobile font size' 'mobile touch scroll enabled'; do
          grep -qF "$marker" vendor/ttyd/html/src/components/terminal/xterm/index.ts \
            || { echo "FAIL: $marker is missing from the client source"; exit 1; }
          grep -qF "$marker" /tmp/client-bundle.js \
            || { echo "FAIL: vendor/ttyd/src/html.h is stale: the source has '$marker' and the shipped header does not. Run hack/build-ttyd-client.sh and commit the header in the fork."; exit 1; }
          echo "client feature ships: $marker"
        done
      # The viewport meta is a different kind of marker: it lives in the client's HTML template rather
      # than in a script, and it is the thing that makes every other phone rule arrive at the size it was
      # chosen for. Without it a phone lays a direct agent URL out at 980px and shrinks it to ~0.4 scale,
      # so the font and the swipe below are present and correct and still look like they are missing.
      - "grep -qF 'width=device-width' vendor/ttyd/html/src/template.html || { echo 'FAIL: the client template has no viewport meta'; exit 1; }"
      - "grep -qF 'width=device-width' /tmp/client-bundle.js || { echo 'FAIL: vendor/ttyd/src/html.h is stale: the template has a viewport meta and the shipped header does not'; exit 1; }"

  - name: render-front-config
    image: docker.io/library/nginx:alpine
    environment:
      TEMPLATE_DIR: .
      CONF_OUT: /tmp/rendered/default.conf
      HTML_OUT: /tmp/rendered/tab-1.html
      # Fixed rather than auto-detected from the step container's /etc/resolv.conf, so the assertions
      # below about the rendered resolver line cannot depend on which node ran the step.
      RESOLVER: 127.0.0.1
    commands:
      # Every command here is a double quoted YAML scalar: a plain scalar containing ": " (a colon before
      # a space) is a YAML mapping, not a string, and "#wrap { grid-template-columns: 1fr 1fr; }" and
      # "FAIL: ..." both read as key/value pairs to a YAML parser. The step would then be a list
      # containing an object, which is not a command.
      - "mkdir -p /tmp/rendered"
      # The rendered file is a server block for conf.d inclusion, so nginx -t needs a wrapper around it.
      - "printf 'events {}\\nhttp {\\n  include %s;\\n}\\n' /tmp/rendered/default.conf > /tmp/nginx.conf"
      # The desktop this repo ships today: three full height columns on the left, four coder bands on the
      # right. Seven panes, which is one more than a page is allowed to hold by default, so it is two pages
      # of 4 and 3 plus the everything-at-once page. The counts are the assertion: a split that filled pages
      # (6+1) instead of balancing them would show up here as the wrong number of iframes on a page.
      - "COLUMNS='coordinator,tester,deployer' ROWS='coder-1,coder-2,coder-3,coder-4' LAYOUT=columns_left sh ./docker-entrypoint.nginx.sh true"
      - "grep -qF 'location /coordinator/ {' /tmp/rendered/default.conf"
      - "grep -qF 'set $slopyphus_upstream http://coordinator:7681;' /tmp/rendered/default.conf"
      - "grep -qF 'rewrite ^/coder-1/(.*)$ /coder-1/$1 break;' /tmp/rendered/default.conf"
      - "grep -qF 'resolver 127.0.0.1 valid=10s ipv6=off;' /tmp/rendered/default.conf"
      # The invariant that catches a template/entrypoint drift: every marker in index.html.template must be
      # substituted, and an unsubstituted one is a page that renders a placeholder as content. A picture a
      # pane's relay saved is fetched by the client as <base>/images/<name>, which is already inside the
      # agent's proxied prefix, so the front needs no location of its own for it.
      - "test $(grep -cF '{{{' /tmp/rendered/tab-1.html) = 0"
      - "grep -qF '#wrap { grid-template-columns: 1fr 1fr; }' /tmp/rendered/tab-1.html"
      - "grep -qF 'group group-columns' /tmp/rendered/tab-1.html"
      - "grep -qF 'group group-rows' /tmp/rendered/tab-1.html"
      # Tabs: a page per group of at most PANES_PER_TAB panes, in declared order, each page a URL.
      - "test $(grep -c '<iframe' /tmp/rendered/tab-1.html) = 4"
      - "test $(grep -c '<iframe' /tmp/rendered/tab-2.html) = 3"
      - "test $(grep -c '<iframe' /tmp/rendered/all.html) = 7"
      # The tab that lost its columns gets the whole viewport for its rows, which is the same rule a
      # single-group desktop gets, applied per page rather than per desktop.
      - "grep -qF '#wrap { grid-template-columns: 1fr; }' /tmp/rendered/tab-2.html"
      - "test $(grep -cF '<nav id=\"tabs\">' /tmp/rendered/tab-1.html) = 1"
      - "grep -qF 'aria-current=\"page\">2</a>' /tmp/rendered/tab-2.html"
      - "grep -qF 'title=\"tab 1 (coordinator tester deployer coder-1)\"' /tmp/rendered/tab-1.html"
      # Tab 1 is a page like every other tab. Asserted as a pair - the file exists and index.html does not -
      # because the previous renderer wrote index.html for tab 1 and branched on it everywhere, which is how
      # `/` and tab 1 quietly became two spellings of one page with two lifecycles: the file nginx ships as
      # its welcome page was overwritten, and a rollout that shrank the desktop left the old one served.
      - "if [ -e /tmp/rendered/index.html ]; then echo 'FAIL: the render writes index.html; tab 1 is tab-1.html now'; exit 1; fi"
      - "grep -qF '<title>slopyphus - tab 1</title>' /tmp/rendered/tab-1.html"
      - "grep -qF 'href=\"/tab-1.html\"' /tmp/rendered/tab-1.html"
      - "if grep -qF 'href=\"/\"' /tmp/rendered/tab-1.html; then echo 'FAIL: a tab link still points at the landing URL instead of a page'; exit 1; fi"
      # The landing URL is an alias, stated in the config rather than left to nginx's index directive, so a
      # request for / also picks up no-store like every other page. Both are grepped because /index.html is
      # the URL every front of this repo has ever served, and an alias that stops working is a 404 on a link
      # someone has already pasted into a chat.
      - "grep -qF 'location = / {' /tmp/rendered/default.conf"
      - "grep -qF 'try_files /tab-1.html =404;' /tmp/rendered/default.conf"
      - "grep -qF 'location = /index.html {' /tmp/rendered/default.conf"
      - "grep -qF 'index tab-1.html;' nginx.conf.template"
      # A phone gets the viewport it asked for. Without this meta, iPhone Safari lays the page out at its
      # ~980px default and scales the result into 390pt, so the 22px tab strip is 8px on the glass and a
      # pane's 12px terminal is 5px - which is the "everything is four times too small" complaint. The
      # meta alone is not the fix either (a phone then gets six 65px panes), so the assertion is a pair:
      # the meta here, and the max-width block in the stylesheet the page links.
      - "grep -qF 'name=\"viewport\" content=\"width=device-width, initial-scale=1' /tmp/rendered/tab-1.html"
      # The mobile shape is CSS, not a rendered thing, so the assertion reads the checkout; the two
      # strings are the load-bearing parts of it - the trigger, and the trick that makes a page's inline
      # grid rule inert without restating it.
      - "grep -qF '@media (max-width: 767px)' slopyphus-desktop.css"
      - "grep -qF 'display: contents' slopyphus-desktop.css"
      # Served, not redirected: a `return` builds an absolute URL out of $server_name and $server_port, and
      # the front testbed measured one sending a browser from a NodePort-style 38137 to port 80.
      - "grep -qF 'location = /tab-2 {' /tmp/rendered/default.conf"
      - "grep -qF 'try_files /tab-2.html =404;' /tmp/rendered/default.conf"
      - "grep -qF 'location = /all {' /tmp/rendered/default.conf"
      # The redirects that cannot be served (a pane's location is a proxy prefix, so it has to redirect)
      # are made relative by the template. The dev cluster measured why: a `return 308 /home-ops/` from
      # behind Traefik answered `Location: http://slopyphus.../home-ops/`, a 308 is cacheable, and the
      # oauth2-proxy session and CSRF cookies are Secure, so the trip to plain http both dropped the
      # session and made the next sign-in unfinishable. Asserting the directive and the shape of every
      # redirect target is what keeps a later edit from writing one out in full.
      - "grep -qF 'absolute_redirect off;' /tmp/rendered/default.conf"
      - "grep -qF 'port_in_redirect off;' /tmp/rendered/default.conf"
      - "if grep -qE 'return 3[0-9][0-9] https?://' /tmp/rendered/default.conf; then echo 'FAIL: a redirect target is written as an absolute URL'; exit 1; fi"
      - "nginx -t -c /tmp/nginx.conf"
      # Scrollbars. This is the thing the desktop is judged on: a bar on the desktop itself costs a strip
      # of every pane's width at once, and a bar inside a pane eats part of that pane. Three causes, all
      # measured in the testbed (hack/front-testbed.sh cdp --url ... --expression-file hack/probe-scrollbars.js
      # and hack/probe-terminal.js, on the 20-column desktop the dev cluster runs at 800x600):
      #   42px of horizontal overflow, from a pane label 78px wide sitting in a pane 40px wide - an
      #     absolutely positioned label is overflow its cell does not stop, and it reaches the viewport.
      #   3px of vertical overflow, at every viewport size, because an iframe is an inline replaced element
      #     and sits on a text baseline: the line box is the iframe plus the font's descent.
      #   a bar in every terminal pane, because ttyd's own CSS is `.xterm .xterm-viewport{overflow-y:scroll}`
      #     and the page above cannot style inside an iframe.
      # The greps pin the shipped answers to those three; the behaviour itself is measured in the testbed
      # rather than asserted here, because there is no browser in this step. They grep the desktop's own
      # stylesheet and script rather than the rendered page, because the front now renders a page per tab
      # and a rule duplicated into N pages is N chances to fix it on one of them.
      - "grep -qF 'display: block;' slopyphus-desktop.css" # iframe is block, so the 3px baseline goes
      - "grep -qF 'max-width: calc(100% - 8px);' slopyphus-desktop.css" # a label stops at its pane
      - "grep -qF 'text-overflow: ellipsis;' slopyphus-desktop.css"
      - "awk '/^html,/,/^}/' slopyphus-desktop.css | grep -q 'overflow: hidden'" # the desktop cannot scroll, so it cannot show a bar
      - "test $(grep -cF '::-webkit-scrollbar{width:0!important;height:0!important}*{scrollbar-width:none!important}' slopyphus-desktop.js) = 1" # the rule injected into every pane
      - "test $(grep -cF 'slopyphus-pane-scrollbars' slopyphus-desktop.js) = 1" # the style element it is injected as
      # Every page links both assets, and the names linked are the names the image copies. This pair of
      # greps exists because the first run of the tabs work rendered a page linking /slopyphus-desktop.css
      # while the directory held desktop.css: an unstyled skeleton of 300x150 iframes, which measures like a
      # broken layout rather than like a missing file.
      - "grep -qF 'COPY slopyphus-desktop.css slopyphus-desktop.js /usr/share/nginx/html/' Dockerfile.nginx"
      - "grep -qF '<link rel=\"stylesheet\" href=\"/slopyphus-desktop.css\" />' /tmp/rendered/tab-1.html"
      - "grep -qF '<script src=\"/slopyphus-desktop.js\"></script>' /tmp/rendered/tab-1.html"
      # A pane is framed with ttyd's own client option that drops its beforeunload handler. Without it the
      # browser asks "Close terminal? this will also terminate the command." on every tab switch, once per
      # pane the page held - and it is untrue here, since a pane is a tmux client and closing it leaves the
      # session running. The option is read from the pane URL's query by the shipped client, so the front can
      # set it and the agent cannot accidentally opt a pane back in.
      - "test $(grep -c '<iframe' /tmp/rendered/tab-1.html) = $(grep -cF 'disableLeaveAlert=true' /tmp/rendered/tab-1.html)"
      - "test $(grep -c '<iframe' /tmp/rendered/all.html) = $(grep -cF 'disableLeaveAlert=true' /tmp/rendered/all.html)"
      - "grep -qF 'src=\"/coordinator/?disableLeaveAlert=true\"' /tmp/rendered/tab-1.html"
      # A pane's client is compiled into a binary, so a cached desktop page beside it keeps pointing at the
      # previous rollout's desktop code, which from a browser looks like a fix that never deployed.
      - "test $(grep -cF 'add_header Cache-Control \"no-store\";' /tmp/rendered/default.conf) -ge 5"
      - "nginx -t -c /tmp/nginx.conf"
      # 20 panes at the default 6 per page is four pages of five. Asserted because the alternative - fill
      # pages and leave a scrap (6,6,6,2) - is four different pane widths on four pages, and because the
      # limit is the whole point of the feature: no page may show more than PANES_PER_TAB panes.
      - "COLUMNS='home-ops,pi-ed,pi-team-room,modelcalls,rooter,coral,chromium,ocr,memebrary,camry,djangolang,structmeta,deployed,macgrubernetes,maclet,macker,darwin-vxlan,quake,minecraft-pinger,pinger' ROWS= sh ./docker-entrypoint.nginx.sh true"
      - "for f in /tmp/rendered/tab-1.html /tmp/rendered/tab-2.html /tmp/rendered/tab-3.html /tmp/rendered/tab-4.html; do test $(grep -c '<iframe' \"$f\") = 5 || { echo \"FAIL: $f is not 5 panes\"; exit 1; }; done"
      # The limit applies to the pages a person is meant to look at. all.html is the exception on purpose:
      # it is the everything-at-once view, and the reason it is a page you go to rather than the default.
      - "for f in /tmp/rendered/tab-1.html /tmp/rendered/tab-*.html; do test $(grep -c '<iframe' \"$f\") -le 6 || { echo \"FAIL: $f shows more than PANES_PER_TAB panes\"; exit 1; }; done"
      - "test $(grep -c '<iframe' /tmp/rendered/all.html) = 20"
      - "nginx -t -c /tmp/nginx.conf"
      # PANES_PER_TAB=0 is the old single-page desktop, and the only remaining way to get 20 panes on one
      # screen. Asserted against the directory the 20-pane case above just wrote: the entrypoint removes the
      # tab pages it is no longer rendering, and a stale tab-N.html is a page that still works while showing
      # panes that are no longer on the desktop.
      - "COLUMNS='a,b,c,d,e,f,g' PANES_PER_TAB=0 sh ./docker-entrypoint.nginx.sh true"
      - "test $(grep -c '<iframe' /tmp/rendered/tab-1.html) = 7"
      - "test $(grep -cF '<nav id=\"tabs\"' /tmp/rendered/tab-1.html) = 0"
      - "grep -qF 'body { --tabs-h: 0px; }' /tmp/rendered/tab-1.html"
      - "if [ -e /tmp/rendered/tab-2.html ] || [ -e /tmp/rendered/tab-4.html ] || [ -e /tmp/rendered/all.html ]; then echo 'FAIL: a previous render left tab pages in the html directory'; exit 1; fi"
      - "echo 'stale tab pages are removed by the render'"
      # The same cleanup has to catch a file this front stopped rendering: an index.html left by an older
      # rollout (or by nginx's own image) is a page a browser can still reach, and it would hold the pane set
      # of whichever render last wrote it.
      - "touch /tmp/rendered/index.html /tmp/rendered/tab-9.html"
      - "COLUMNS='a,b' sh ./docker-entrypoint.nginx.sh true"
      - "if [ -e /tmp/rendered/index.html ] || [ -e /tmp/rendered/tab-9.html ]; then echo 'FAIL: a leftover index.html or tab page survived the render'; exit 1; fi"
      - "echo 'leftover pages from an older rollout are removed, index.html included'"
      - "if PANES_PER_TAB='six' COLUMNS='a' sh ./docker-entrypoint.nginx.sh true 2>/dev/null; then echo 'FAIL: a non-numeric PANES_PER_TAB was accepted'; exit 1; fi"
      - "echo 'PANES_PER_TAB must be a number or 0'"
      - "nginx -t -c /tmp/nginx.conf"
      # An arbitrary origin, framed through nginx: Host header and base path both come from the URL.
      - "COLUMNS='web=https://www.google.com/maps' ROWS= sh ./docker-entrypoint.nginx.sh true"
      - "grep -qF 'proxy_set_header Host www.google.com;' /tmp/rendered/default.conf"
      - "grep -qF 'rewrite ^/web/(.*)$ /maps/$1 break;' /tmp/rendered/default.conf"
      - "nginx -t -c /tmp/nginx.conf"
      # Kubernetes. nginx's resolver does not expand search domains (measured in the dev cluster: a bare
      # Service name 502s, the FQDN does not), so SVC_SUFFIX lengthens the lookup and nothing else - the
      # agent's own base path stays the short name ttyd was started with.
      - "COLUMNS='coder-1' SVC_SUFFIX=slopyphus.svc.cluster.local AGENT_PORT=443 sh ./docker-entrypoint.nginx.sh true"
      - "grep -qF 'set $slopyphus_upstream http://coder-1.slopyphus.svc.cluster.local:443;' /tmp/rendered/default.conf"
      - "grep -qF 'rewrite ^/coder-1/(.*)$ /coder-1/$1 break;' /tmp/rendered/default.conf"
      - "if SVC_SUFFIX='bad suffix' COLUMNS='a' sh ./docker-entrypoint.nginx.sh true 2>/dev/null; then echo 'FAIL: an invalid SVC_SUFFIX was accepted'; exit 1; fi"
      - "echo 'invalid SVC_SUFFIX rejected'"
      - "nginx -t -c /tmp/nginx.conf"
      # The desktop the dev cluster actually runs (home-ops/clusters/dev/applications/slopyphus): one
      # agent, columns only, no rows group. Asserted because it differs from the defaults above in the one
      # rule that decides how the viewport is shared - a single group gets all of it - and because the
      # Service name and the pane name are the same string there, which is the case a rename would break.
      - "COLUMNS='home-ops' ROWS= SVC_SUFFIX=slopyphus.svc.cluster.local sh ./docker-entrypoint.nginx.sh true"
      - "grep -qF 'set $slopyphus_upstream http://home-ops.slopyphus.svc.cluster.local:7681;' /tmp/rendered/default.conf"
      - "grep -qF 'rewrite ^/home-ops/(.*)$ /home-ops/$1 break;' /tmp/rendered/default.conf"
      - "grep -qF 'return 308 /home-ops/;' /tmp/rendered/default.conf"
      - "grep -qF '#wrap { grid-template-columns: 1fr; }' /tmp/rendered/tab-1.html"
      - "grep -qF 'body { --tabs-h: 0px; }' /tmp/rendered/tab-1.html" # one pane, one page, no tab strip
      - "test $(grep -c '<iframe' /tmp/rendered/tab-1.html) = 1"
      - "nginx -t -c /tmp/nginx.conf"
      # Mistakes that used to produce a desktop nobody could bring up, or one that half worked.
      - "if COLUMNS='a' LAYOUT=sideways sh ./docker-entrypoint.nginx.sh true 2>/dev/null; then echo 'FAIL: an invalid LAYOUT was accepted'; exit 1; fi"
      - "echo 'invalid LAYOUT rejected'"
      - "if COLUMNS= ROWS= sh ./docker-entrypoint.nginx.sh true 2>/dev/null; then echo 'FAIL: an empty desktop was accepted'; exit 1; fi"
      - "echo 'empty desktop rejected'"
      - "if COLUMNS='coordinator,coder-1' ROWS='coder-1' sh ./docker-entrypoint.nginx.sh true 2>/dev/null; then echo 'FAIL: a duplicated pane name was accepted'; exit 1; fi"
      - "echo 'duplicated pane name rejected'"
      - "if COLUMNS='healthz' sh ./docker-entrypoint.nginx.sh true 2>/dev/null; then echo 'FAIL: a pane called healthz was accepted'; exit 1; fi"
      - "echo 'reserved pane name rejected'"
      # The front's own pages are files in the directory an agent's location is a prefix of, so a pane named
      # after one of them is a proxy location and a static page sharing a path.
      - "for name in index index.html all all.html tab-1 tab-9 slopyphus-desktop.css report.html; do if COLUMNS=\"$name\" sh ./docker-entrypoint.nginx.sh true 2>/dev/null; then echo \"FAIL: a pane called $name was accepted\"; exit 1; fi; done"
      - "echo 'the front keeps its own page and asset names'"

when:
  - event: push
    branch: master
  - event: pull_request
