# Build check for both images this repo ships, plus a render check for the front's config generator.
#
# This repository has no test suite: it is a Dockerfile that assembles a terminal environment (ubuntu,
# tmux, ttyd, trzsz, docker-cli, uv) plus a nginx front, and "does the image still build" is a real
# gate, because every layer here is an apt/PPA/curl install against a moving upstream: `ubuntu:26.04`,
# the trzsz PPA and the docker.com repo can each break the build without a single line of this repo
# changing.
#
# Building the front image only proves the layers copy, though. The front's nginx.conf and index.html are
# generated at container start by docker-entrypoint.nginx.sh from COLUMNS / ROWS / LAYOUT, so the part
# that can silently rot is the generator, not the image: a rendered config that nginx refuses to start
# with, or a pane whose rewrite sends ttyd to the wrong base path, is invisible to `docker build`. The
# second step runs the generator against a real nginx and asserts what it emitted.
#
# That step uses the public `nginx:alpine` image and the templates straight from the checkout, not the
# image built by the previous step: Woodpecker pulls a step image from a registry, and
# `initialed85/slopyphus-nginx:$CI_COMMIT_SHA` exists only in the CI node's daemon (nothing here pushes
# it), so it is not something a later step can run.
#
# Deliberately does NOT push: this file is the gate, `.woodpecker/build.yaml` is the publish, and on a
# push to master the gate runs first and the publish runs the same builds again against the same pinned
# node (so the second run is mostly `CACHED`). A publish should not be able to ship something the gate
# would have refused, and the gate should not be the thing that decides what is in the registry.
#
# The build runs against one CI node's dockerd over TCP (`docker-beefcake-ci-1` Service ->
# 192.168.1.213:2375, published by home-ops
# clusters/dev/applications/woodpecker/files/enable-docker-tcp.sh). Pinning one node per repo is what
# keeps the layer cache warm, which matters a lot here: this Dockerfile is apt-heavy.
#
# The GitHub repo used to be `slophyphus` (a stray h) while the image tag was always
# `initialed85/slopyphus` (no h). The repo is now `slopyphus`, so the names match; the image names never
# changed, because they are what the cluster's kustomizations and any hand-pull already reference.
steps:
  - name: build-app-image
    image: docker.io/library/docker:cli
    privileged: true
    environment:
      DOCKER_HOST: tcp://docker-beefcake-ci-1:2375
    commands:
      - docker info --format 'daemon={{.Name}} images_before={{.Images}}'
      - docker build --pull --progress=plain -t initialed85/slopyphus:$CI_COMMIT_SHA -f ./Dockerfile .
      - docker build --pull --progress=plain -t initialed85/slopyphus-nginx:$CI_COMMIT_SHA -f ./Dockerfile.nginx .
      # The agent's ttyd is compiled from vendor/ttyd, so the build only means something if the checkout
      # actually carries the vendored sources. plugin-git clones submodules recursively by default
      # (`recursive: true`, `submodule-partial: true` at depth 1), which checks out the pinned commit
      # rather than a branch tip - so these two tests are really asserting that the pins are real.
      - "test -s vendor/ttyd/src/html.h || (echo 'FAIL: vendor/ttyd is not populated (git submodule update --init --recursive)'; exit 1)"
      - "test -s vendor/xterm.js/package.json || (echo 'FAIL: vendor/xterm.js is not populated'; exit 1)"
      # `ttyd --version` is the only evidence inside a running container of which ttyd is serving a pane,
      # and the -slopyphus suffix comes from a hunk in the fork's CMakeLists.txt that a rebase onto
      # upstream can silently drop. The builder stage greps for it too; this is the same check against
      # the shipped image instead of the intermediate one.
      - "docker run --rm --entrypoint ttyd initialed85/slopyphus:$CI_COMMIT_SHA --version | grep slopyphus"
      # The fork links against shared libraries apt would otherwise have pulled in for ttyd's package;
      # an unresolved `ldd` line is an image that starts and then fails the first time a pane asks for
      # ttyd, which is the worst possible time to find out.
      - "if docker run --rm --entrypoint ldd initialed85/slopyphus:$CI_COMMIT_SHA /usr/bin/ttyd | grep 'not found'; then echo 'FAIL: the forked ttyd has unresolved libraries in the agent image'; exit 1; fi"
      - "echo 'agent ttyd links resolve'"
      # And the failure `ldd` cannot see: libwebsockets dlopens its libuv event loop plugin, so a missing
      # libwebsockets-evlib-uv leaves a binary with a perfectly clean `ldd` that still refuses to start
      # (`lws_create_context: failed to load evlib_uv`). This check was written after that exact mistake,
      # not before it.
      - "if docker run --rm --entrypoint timeout initialed85/slopyphus:$CI_COMMIT_SHA 5 ttyd -p 7699 true 2>&1 | grep -q 'failed to load evlib'; then echo 'FAIL: libwebsockets cannot load its libuv plugin in the agent image'; exit 1; fi"
      - "echo 'agent ttyd starts (event loop plugin loads)'"
      - docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep slopyphus || true
      - docker system df

  - name: check-vendored-client
    image: docker.io/library/node:22-slim
    commands:
      # ttyd embeds its whole browser UI as a generated header (`vendor/ttyd/src/html.h`, gzipped bytes as
      # a C array), and the agent image compiles that header rather than the TypeScript under
      # vendor/ttyd/html/src. So a client edit that is not rebuilt lands in the fork's source tree, passes
      # review, and changes nothing a user can see. This is the gate for that mistake: every marker has to
      # be in the source *and* in the shipped header, which is only true if build-ttyd-client.sh ran.
      - "test -s vendor/ttyd/src/html.h || (echo 'FAIL: vendor/ttyd/src/html.h is empty'; exit 1)"
      - "node hack/html-h-payload.mjs vendor/ttyd/src/html.h > /tmp/client-bundle.js"
      - "test -s /tmp/client-bundle.js"
      # String literals survive minification, call sites do not, so the markers are messages the client
      # logs rather than identifiers - and a marker has to be a single literal, not a phrase a template
      # expression assembles at runtime, which is why this one stops at the arrow rather than quoting the
      # whole log line. 'fallback clipboard copy failed' is the OSC 52 clipboard path and
      # 'Shift+Enter -> newline enabled' is the keystroke mapping; both are things a front page cannot
      # provide for a pane it only frames, which is the reason ttyd is forked at all.
      - |
        for marker in 'fallback clipboard copy failed' 'malformed OSC 52 payload' 'Shift+Enter -> newline'; do
          grep -qF "$marker" vendor/ttyd/html/src/components/terminal/xterm/index.ts \
            || { echo "FAIL: $marker is missing from the client source"; exit 1; }
          grep -qF "$marker" /tmp/client-bundle.js \
            || { echo "FAIL: vendor/ttyd/src/html.h is stale: the source has '$marker' and the shipped header does not. Run hack/build-ttyd-client.sh and commit the header in the fork."; exit 1; }
          echo "client feature ships: $marker"
        done

  - name: render-front-config
    image: docker.io/library/nginx:alpine
    environment:
      TEMPLATE_DIR: .
      CONF_OUT: /tmp/rendered/default.conf
      HTML_OUT: /tmp/rendered/index.html
      # Fixed rather than auto-detected from the step container's /etc/resolv.conf, so the assertions
      # below about the rendered resolver line cannot depend on which node ran the step.
      RESOLVER: 127.0.0.1
    commands:
      # Every command here is a double quoted YAML scalar: a plain scalar containing ": " (a colon before
      # a space) is a YAML mapping, not a string, and "#wrap { grid-template-columns: 1fr 1fr; }" and
      # "FAIL: ..." both read as key/value pairs to a YAML parser. The step would then be a list
      # containing an object, which is not a command.
      - "mkdir -p /tmp/rendered"
      # The rendered file is a server block for conf.d inclusion, so nginx -t needs a wrapper around it.
      - "printf 'events {}\\nhttp {\\n  include %s;\\n}\\n' /tmp/rendered/default.conf > /tmp/nginx.conf"
      # The desktop this repo ships today: three full height columns on the left, four coder bands on the right.
      - "COLUMNS='coordinator,tester,deployer' ROWS='coder-1,coder-2,coder-3,coder-4' LAYOUT=columns_left sh ./docker-entrypoint.nginx.sh true"
      - "grep -qF 'location /coordinator/ {' /tmp/rendered/default.conf"
      - "grep -qF 'set $slopyphus_upstream http://coordinator:7681;' /tmp/rendered/default.conf"
      - "grep -qF 'rewrite ^/coder-1/(.*)$ /coder-1/$1 break;' /tmp/rendered/default.conf"
      - "grep -qF 'resolver 127.0.0.1 valid=10s ipv6=off;' /tmp/rendered/default.conf"
      - "grep -qF '#wrap { grid-template-columns: 1fr 1fr; }' /tmp/rendered/index.html"
      - "grep -qF 'group group-columns' /tmp/rendered/index.html"
      - "grep -qF 'group group-rows' /tmp/rendered/index.html"
      - "test $(grep -c '<iframe' /tmp/rendered/index.html) = 7"
      # Scrollbars. This is the thing the desktop is judged on: a bar on the desktop itself costs a strip
      # of every pane's width at once, and a bar inside a pane eats part of that pane. Three causes, all
      # measured in the testbed (hack/front-testbed.sh cdp --url ... --expression-file hack/probe-scrollbars.js
      # and hack/probe-terminal.js, on the 20-column desktop the dev cluster runs at 800x600):
      #   42px of horizontal overflow, from a pane label 78px wide sitting in a pane 40px wide - an
      #     absolutely positioned label is overflow its cell does not stop, and it reaches the viewport.
      #   3px of vertical overflow, at every viewport size, because an iframe is an inline replaced element
      #     and sits on a text baseline: the line box is the iframe plus the font's descent.
      #   a bar in every terminal pane, because ttyd's own CSS is `.xterm .xterm-viewport{overflow-y:scroll}`
      #     and the page above cannot style inside an iframe.
      # The greps pin the shipped answers to those three; the behaviour itself is measured in the testbed
      # rather than asserted here, because there is no browser in this step.
      - "grep -qF 'display: block;' /tmp/rendered/index.html" # iframe is block, so the 3px baseline goes
      - "grep -qF 'max-width: calc(100% - 8px);' /tmp/rendered/index.html" # a label stops at its pane
      - "grep -qF 'text-overflow: ellipsis;' /tmp/rendered/index.html"
      - "awk '/^      html,/,/^      }/' /tmp/rendered/index.html | grep -q 'overflow: hidden'" # the desktop cannot scroll, so it cannot show a bar
      - "test $(grep -cF '::-webkit-scrollbar{width:0!important;height:0!important}*{scrollbar-width:none!important}' /tmp/rendered/index.html) = 1" # the rule injected into every pane
      - "test $(grep -cF 'slopyphus-pane-scrollbars' /tmp/rendered/index.html) = 1" # the style element it is injected as
      - "nginx -t -c /tmp/nginx.conf"
      # An arbitrary origin, framed through nginx: Host header and base path both come from the URL.
      - "COLUMNS='web=https://www.google.com/maps' ROWS= sh ./docker-entrypoint.nginx.sh true"
      - "grep -qF 'proxy_set_header Host www.google.com;' /tmp/rendered/default.conf"
      - "grep -qF 'rewrite ^/web/(.*)$ /maps/$1 break;' /tmp/rendered/default.conf"
      - "nginx -t -c /tmp/nginx.conf"
      # Kubernetes. nginx's resolver does not expand search domains (measured in the dev cluster: a bare
      # Service name 502s, the FQDN does not), so SVC_SUFFIX lengthens the lookup and nothing else - the
      # agent's own base path stays the short name ttyd was started with.
      - "COLUMNS='coder-1' SVC_SUFFIX=slopyphus.svc.cluster.local AGENT_PORT=443 sh ./docker-entrypoint.nginx.sh true"
      - "grep -qF 'set $slopyphus_upstream http://coder-1.slopyphus.svc.cluster.local:443;' /tmp/rendered/default.conf"
      - "grep -qF 'rewrite ^/coder-1/(.*)$ /coder-1/$1 break;' /tmp/rendered/default.conf"
      - "if SVC_SUFFIX='bad suffix' COLUMNS='a' sh ./docker-entrypoint.nginx.sh true 2>/dev/null; then echo 'FAIL: an invalid SVC_SUFFIX was accepted'; exit 1; fi"
      - "echo 'invalid SVC_SUFFIX rejected'"
      - "nginx -t -c /tmp/nginx.conf"
      # The desktop the dev cluster actually runs (home-ops/clusters/dev/applications/slopyphus): one
      # agent, columns only, no rows group. Asserted because it differs from the defaults above in the one
      # rule that decides how the viewport is shared - a single group gets all of it - and because the
      # Service name and the pane name are the same string there, which is the case a rename would break.
      - "COLUMNS='home-ops' ROWS= SVC_SUFFIX=slopyphus.svc.cluster.local sh ./docker-entrypoint.nginx.sh true"
      - "grep -qF 'set $slopyphus_upstream http://home-ops.slopyphus.svc.cluster.local:7681;' /tmp/rendered/default.conf"
      - "grep -qF 'rewrite ^/home-ops/(.*)$ /home-ops/$1 break;' /tmp/rendered/default.conf"
      - "grep -qF 'return 308 /home-ops/;' /tmp/rendered/default.conf"
      - "grep -qF '#wrap { grid-template-columns: 1fr; }' /tmp/rendered/index.html"
      - "test $(grep -c '<iframe' /tmp/rendered/index.html) = 1"
      - "nginx -t -c /tmp/nginx.conf"
      # Mistakes that used to produce a desktop nobody could bring up, or one that half worked.
      - "if COLUMNS='a' LAYOUT=sideways sh ./docker-entrypoint.nginx.sh true 2>/dev/null; then echo 'FAIL: an invalid LAYOUT was accepted'; exit 1; fi"
      - "echo 'invalid LAYOUT rejected'"
      - "if COLUMNS= ROWS= sh ./docker-entrypoint.nginx.sh true 2>/dev/null; then echo 'FAIL: an empty desktop was accepted'; exit 1; fi"
      - "echo 'empty desktop rejected'"
      - "if COLUMNS='coordinator,coder-1' ROWS='coder-1' sh ./docker-entrypoint.nginx.sh true 2>/dev/null; then echo 'FAIL: a duplicated pane name was accepted'; exit 1; fi"
      - "echo 'duplicated pane name rejected'"
      - "if COLUMNS='healthz' sh ./docker-entrypoint.nginx.sh true 2>/dev/null; then echo 'FAIL: a pane called healthz was accepted'; exit 1; fi"
      - "echo 'reserved pane name rejected'"

when:
  - event: push
    branch: master
  - event: pull_request
